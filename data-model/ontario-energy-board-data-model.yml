generated: '2026-07-27'
method: derived
source: openapi/ontario-energy-board-rds-openapi.yml, openapi/ontario-energy-board-open-data-openapi.yml, and a
  crawl of the 40 OEB Open Data dataset pages on 2026-07-27
note: 'Two data models sit behind the Ontario Energy Board''s public surfaces and they do not connect to each other.

  (1) The REGULATORY RECORD, exposed through RDS: one entity - Record - carrying the OEB''s own regulatory fields,
  with Case Number as the de facto join key across everything the Board does. There is no case entity, no applicant
  entity and no relationship endpoint; the graph below is reconstructed from the fields the search response returns.

  (2) The OPEN DATA CORPUS: 40 datasets, 198 published files, no identifiers, no cross-file keys published, no schema
  and no dictionary beyond an Excel import guide. The distributor name is the only practical join key across the
  RRR, scorecard and complaints series, and it is free text.

  The full published inventory is recorded below, including the files this run could not verify - the OEB host stopped
  answering under sustained probing, so ''verified_200: false'' means unverified in this run, NOT missing.'
entities:
- name: Record
  surface: rds
  description: A filing, decision, order, licence, code amendment or piece of correspondence in the OEB case record.
  identifier:
    field: Uri
    type: integer
    opaque: true
    note: Content Manager record URI; the key for /Record/{uri}/File/document.
  fields:
  - RecordTitle
  - RecordExtension
  - RecordDateModified
  - Fields.CaseNumber
  - Fields.SIDocumentType
  - Fields.Applicant
  - Fields.EnergyType
  - Fields.PrimaryApplicationType
  - Fields.DateIssued
  - Fields.fDateReceived
  operations:
  - searchRecords
  - getRecord
  - downloadRecordDocument
- name: Case
  surface: rds
  description: An OEB proceeding, identified by case number (EB-YYYY-NNNN). Not an addressable entity - it exists
    only as a value on Record.
  identifier:
    field: Fields.CaseNumber
    type: string
    example: EB-2021-0183
    addressable: false
  note: There is no /Case endpoint. A case is retrieved as "every Record whose CaseNumber equals it" - q=CaseNumber=EB-2021-0183.
- name: Location
  surface: rds
  description: A party - applicant, intervenor, or the OEB itself. Returned as a LocationRef with its own Content
    Manager Uri.
  identifier:
    field: Applicant.Uri
    type: integer
    addressable: false
  note: The LocationRef carries a Uri (e.g. 1087 for the Ontario Energy Board) but no Location endpoint is exposed
    to anonymous callers.
- name: Document
  surface: rds
  description: The filed bytes behind a Record. Format is on the Record as RecordExtension (PDF, MSG, DOC, XLS).
  identifier:
    field: Uri (of the parent Record)
    addressable: true
  operations:
  - downloadRecordDocument
- name: Dataset
  surface: open-data
  description: A named Open Data publication with a landing page and one or more files.
  identifier:
    field: landing page URL
    addressable: true
  note: No dataset identifier, no metadata record, no DCAT/CKAN representation. The page is the identifier.
- name: Distributor
  surface: open-data
  description: An Ontario electricity or natural gas distributor - the subject of the scorecard, complaints, RRR
    and service-area datasets.
  identifier:
    field: distributor name (free text inside each XML file)
    addressable: false
  note: 'This is the corpus-wide join key and it is unstable by construction: no licence number, no code, no GUID
    is published as a cross-file identifier. Anyone joining the scorecard to an RRR series must match on name.'
- name: Licence
  surface: open-data
  description: An OEB licence held by a market participant, published in the licensed market participants register
    (605 KB XML, refreshed alongside the applications register).
  identifier:
    field: licence number (inside the XML)
    addressable: false
- name: Application
  surface: open-data
  description: An open application before the Board, published in the daily-refreshed applications register.
  identifier:
    field: case number (inside the XML)
    addressable: false
  note: 'This is the one real bridge between the two models: the case number in the applications register is the
    same case number RDS searches on.'
relationships:
- from: Record
  to: Case
  type: belongs_to
  via: Fields.CaseNumber
  confidence: high
  evidence: Every observed search hit carries CaseNumber; q=CaseNumber=EB-2021-0183 returns 40 records.
- from: Record
  to: Location
  type: belongs_to
  via: Fields.Applicant (LocationRef.Uri)
  confidence: high
  evidence: Observed LocationRef with LocationFormattedName "Ontario Energy Board", Uri 1087.
- from: Record
  to: Document
  type: has_one
  via: /Record/{uri}/File/document
  confidence: high
  evidence: HTTP 200 application/pdf, 339,517 bytes for Uri 891285.
- from: Case
  to: Record
  type: has_many
  via: CaseNumber search clause
  confidence: high
- from: Dataset
  to: File
  type: has_many
  via: links on the dataset landing page
  confidence: high
  evidence: 40 pages crawled, 198 file links extracted.
- from: Application
  to: Case
  type: same_as
  via: case number
  confidence: medium
  evidence: The applications register keys on OEB case numbers of the same EB-YYYY-NNNN shape RDS indexes; the linkage
    is by convention, not by any published identifier scheme.
- from: Distributor
  to: Scorecard
  type: has_many
  via: distributor name
  confidence: medium
  evidence: Twelve annual scorecard files (2013-2024), each keyed on distributor name.
- from: Distributor
  to: RRRFiling
  type: has_many
  via: distributor name
  confidence: medium
- from: Distributor
  to: ServiceArea
  type: has_one
  via: distributor name in the GIS attribute table
  confidence: medium
  evidence: Electricity and natural gas boundary ZIP bundles.
identifier_schemes:
- id: oeb-case-number
  pattern: EB-YYYY-NNNN
  example: EB-2021-0183
  scope: OEB proceedings
  published_registry: https://www.oeb.ca/_html/xml/all_open_appl_Cases_v2_reportFile.xml
- id: content-manager-uri
  pattern: integer
  example: 891285
  scope: RDS records and locations
  stability: unknown - the OEB makes no commitment about URI stability, and these are vendor-internal identifiers
gaps:
- No published data dictionary for any dataset. The XML element names are the only documentation.
- No stable machine identifier for a distributor across the RRR, scorecard, complaints and GIS series.
- No JSON representation of any Open Data dataset - XML, XLSX and ZIP only.
- No relationship between the Open Data corpus and RDS beyond the shared case-number convention.
- No schema, XSD or JSON Schema published for any XML file.
