note: >-
  The Ontario Energy Board publishes no API changelog, no release notes and no RSS feed of data
  changes - there is no API to version. What it does publish, and what is captured here, is a dated
  change record for the Open Data programme itself: three signed letters from the OEB to the sector
  announcing each expansion of the programme, each verified live as a PDF on 2026-07-27. Alongside
  them this file records the Last-Modified dates observed on the data files themselves, which is the
  only per-dataset change signal that exists. Everything below is dated and provider-published;
  nothing is inferred.
