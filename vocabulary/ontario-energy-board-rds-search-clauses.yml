query_syntax:
  parameter: q
  comparison: 'q=<term>=<value>   # e.g. q=CaseNumber=EB-2021-0183'
  contains: 'q=<term>:<value>     # e.g. q=anyWord:rate'
  combination: clauses may be combined with and / or (the search form exposes three clause slots joined
    by And/Or)
  wildcards_note: 'A comparison operator with a list or wildcard is rejected: q=CaseNumber=EB-2024-* returns
    TotalResults 0 with SearchTitle ''When using a comparison operator (=) you cannot specify a list of
    values''.'
