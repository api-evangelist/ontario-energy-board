source: https://www.rds.oeb.ca/CMWebDrawer/Help/WDSearchClauseDefJS?trimType=Record
name: OEB Regulatory Document Search (RDS) query vocabulary
note: The complete, machine-readable set of search clauses the OEB's Regulatory Document Search accepts
  in the `q` parameter, fetched anonymously (HTTP 200, text/javascript, 72,885 bytes) on 2026-07-27 from
  the live WebDrawer help endpoint that the RDS search form itself loads. Each clause is usable as `q=<term>=<value>`
  (comparison) or `q=<term>:<value>` (contains/word), verified live for CaseNumber, EnergyType, PrimaryApplicationType
  and anyWord. The 62 `Additional Fields` clauses are the OEB's own user-defined regulatory fields (Case
  Number, Energy Type, Applicant, Primary Application Type, OEB/SI/CI/COM/CER/MPE Document Type, Date
  Issued, Date Received by OEB); the remainder are Micro Focus / OpenText Content Manager record-management
  clauses inherited from the product. The OEB publishes no prose documentation for any of this — the vocabulary
  is real and live, but undocumented and unsupported.
