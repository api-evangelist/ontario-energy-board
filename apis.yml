- aid: ontario-energy-board:oeb-regulatory-document-search
  name: OEB Regulatory Document Search (RDS)
  description: The OEB's public regulatory document search, serving every filing, decision,
    order, licence, code amendment and piece of correspondence in the Board's case record. It
    runs on Micro Focus / OpenText Content Manager WebDrawer, and the OEB links directly to
    parameterised query URLs of the form /CMWebDrawer/Record?q=CaseNumber=EB-2021-0183&sortBy=recRegisteredOn-&pageSize=400
    from its own website — the licensed-companies list alone links hundreds of them. Fetched
    anonymously on 2026-07-27, this surface also honours a `format=json` parameter and returns
    application/json — a Content Manager ServiceAPIModel payload with Results, TotalResults,
    Count, HasMoreItems and typed Fields including CaseNumber, SIDocumentType, Applicant, EnergyType,
    PrimaryApplicationType and DateIssued — while /CMWebDrawer/Record/{uri}/File/document returns
    the underlying PDF. IMPORTANT — the OEB publishes no API reference, no base-URI statement,
    no query-syntax documentation, no OpenAPI and no terms for this interface; the JSON output
    is default behaviour of the underlying WebDrawer product, not a product the OEB documents
    or supports. It is recorded here because it was verified live and anonymous, not because
    it is an offered API. No key, no signup, no rate-limit policy published.
  humanURL: https://www.oeb.ca/rds
  baseURL: https://www.rds.oeb.ca/CMWebDrawer
