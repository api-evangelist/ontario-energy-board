aid: ontario-energy-board
url: https://raw.githubusercontent.com/api-evangelist/ontario-energy-board/refs/heads/main/apis.yml
name: Ontario Energy Board
kind: company
description: The Ontario Energy Board (OEB) is the independent regulator of Ontario's electricity
  and natural gas sectors, licensing and rate-regulating roughly 60 electricity distributors,
  the province's transmitters, storage and generation licensees, unit sub-meter providers, energy
  retailers and gas marketers, and Enbridge Gas. It sits above the wires-and-pipes layer of
  Canada's largest provincial energy market — it does not own assets, does not run the wholesale
  market (that is IESO) and holds no customer meter data — so everything it publishes is regulatory,
  rate and utility-performance data rather than consumption data. Its API posture is the sharpest
  consumer-versus-market split this series has recorded in Canada. On market data it is genuinely
  open — an Open Data programme launched September 2022 under Ontario's Digital and Data Directive
  publishes 40 datasets - 198 individual files, verified by crawl on 2026-07-27; the programme's
  own earlier count was 18 - as anonymous, key-free XML, XLSX and GIS files under the Open Government
  Licence – Ontario, covering every open application before the Board (updated daily), current
  electricity and natural gas rates, distributor service-territory boundaries, the distributor
  performance scorecard, consumer complaints, and thirteen Reporting and Record-keeping Requirements
  (RRR) filings series going back to 2015. On consumer data it publishes nothing at all, because
  it holds nothing — it is instead the supervisor of the consumer-data mandate. Ontario is the
  only Canadian jurisdiction with a compulsory energy-data-sharing rule — O. Reg. 633/21 (Energy
  Data) under the Electricity Act, 1998 required rate-regulated electricity and natural gas
  utilities to implement Green Button Download My Data and Connect My Data to NAESB REQ.21 ESPI
  v3.3 by 1 November 2023 — and the OEB is the body that ran the consultation (EB-2021-0183),
  amended the Retail Settlement Code, collected quarterly progress reports and publishes the
  implementation status register naming 54 confirmed distributors and 6 extensions. There is
  no developer portal, no OpenAPI, no API key and no signup — just files, plus an undocumented
  but live JSON output on the regulatory document search.
