apis:
- aid: ontario-energy-board:oeb-open-data
  name: OEB Open Data
  description: The Ontario Energy Board's Open Data programme, launched September 2022 under
    Ontario's Digital and Data Directive (2021) and expanded in October 2023 ("Open Data 2.0")
    and August 2024. A crawl of both pages of the programme index on 2026-07-27 found 40 datasets
    linking 198 individual files (the earlier round recorded 18 datasets), all directly downloadable, anonymous, key-free
    files — no registration, no application, no rate limit and no terms click-through — under
    the Open Government Licence – Ontario. The largest share is XML — the daily-refreshed register
    of every open application before the Board, three monthly/quarterly rate files that back
    the OEB's own bill calculator, twelve annual electricity distributor performance scorecard
    files (2013-2024), ten annual consumer complaint files, and thirteen Reporting and Record-keeping
    Requirements (RRR) series covering system reliability, service quality, major event response,
    billing accuracy, LEAP low-income assistance, customers and connections, labour, capital,
    supply and delivery, demand and revenue, utility characteristics and regulated return on
    equity, each published as separate current, 2015-2021, 2023 and 2024 files. Distributor
    service-territory boundaries ship as GIS ZIP archives for electricity and natural gas. This
    is not a query API — there is no base path, no parameters, no pagination and no machine-readable
    contract of any kind. It is a set of stable, versioned, anonymously fetchable files with
    a published guide for importing the XML into Excel. Verified live on 2026-07-27, every URL
    below returning HTTP 200.
