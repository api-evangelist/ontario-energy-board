note: >-
  The Ontario Energy Board publishes NO Model Context Protocol server. No hosted or remote MCP
  endpoint exists, nothing is registered in any MCP registry, and no OEB npm or PyPI package exists to
  run one locally. The tool list below is a CANDIDATE design derived from the operations this repo
  verified live - it describes what an MCP server over OEB data would expose, not something the OEB
  offers. Because no server exists, NO `MCPServer` and NO `ToolCrosswalk` pointer is wired into
  apis.yml; wiring one would claim a surface that is not there.
