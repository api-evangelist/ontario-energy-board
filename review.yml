enrichment_rounds:
- date: '2026-07-27'
  round: 'enrichment 2026-07-27 (search / generate / derive)'
  summary: >-
    Second pass over the same organisation, this time hunting for machine-readable contracts rather
    than describing the surface. Three findings change what the first review recorded, and one
    confirms it.
  corrections:
  - claim: '"18 datasets"'
    correction: >-
      The Open Data index has two pages. Crawling both on 2026-07-27 found 40 dataset landing pages
      linking 198 individual files - the first pass saw only page one. The undercounted material is
      substantial: the entire natural gas RRR series (13 datasets), further electricity RRR sections
      (2.1.7 trial balance, 2.1.8, 2.1.9, 2.1.14 net metering, 2.1.5.8, 3.1.1, 3.1.2), the licensed
      market participants register, intervenor cost awards, historical RPP rates and the eight
      Yearbook spreadsheets. Full inventory: data-model/ontario-energy-board-data-model.yml.
  - claim: '"no machine-readable contract of any kind"'
    correction: >-
      True of anything the OEB authored, but not true of what it serves. The RDS search form loads
      https://www.rds.oeb.ca/CMWebDrawer/Help/WDSearchClauseDefJS?trimType=Record (HTTP 200,
      text/javascript, 72,885 bytes) - a machine-readable declaration of all 303 accepted search
      clauses, 62 of them the OEB's own regulatory fields, 87 sortable. It is the query vocabulary
      for the case record, live and anonymous. Captured in
      vocabulary/ontario-energy-board-rds-search-clauses.yml.
  - claim: '"no rate limit"'
    correction: >-
      No PUBLISHED rate limit, and no signalling - but the limit is real. www.oeb.ca stopped
      answering entirely (connection timeouts, no HTTP status, no Retry-After, no 429) after roughly
      200 requests in 20 minutes at up to 20 concurrent connections, then recovered after a pause.
      www.rds.oeb.ca was unaffected throughout.
  new_findings:
  - id: rds-error-semantics
    finding: >-
      The RDS search surface returns HTTP 200 for a rejected query. An unknown search clause, or a
      wildcard used with the '=' operator, produces 200 with an empty Results array and the reason in
      plain English in SearchTitle. Record detail (GET /Record/{uri}) returns HTTP 500 with a
      TrimException ("Error retrieving data for property RecordContainer. Access denied.",
      TrimErrorCode 22760) to anonymous callers, while the document bytes under the same URI serve
      fine at HTTP 200. format=xml is refused with 403. Captured in
      errors/ontario-energy-board-problem-types.yml.
  - id: azure-apim-gateway
    finding: >-
      The www.oeb.ca Content-Security-Policy connect-src directive names
      https://apim-rds-dev-001.azure-api.net/ - an Azure API Management gateway fronting RDS. It
      answers with the Azure APIM error envelope but exposes no anonymous product, no /openapi.json,
      no /swagger.json and no developer portal. Evidence that an API-management layer exists behind
      the scenes without any public API programme in front of it. Worth re-probing on a later round.
  - id: no-well-known-anywhere
    finding: >-
      Every /.well-known/ path (security.txt, openid-configuration, oauth-authorization-server,
      api-catalog, ai-plugin.json) returns a clean HTTP 404 on both www.oeb.ca and www.rds.oeb.ca, as
      does /llms.txt. api., data., developer., docs., opendata., status. and trust..oeb.ca do not
      resolve. No SDK exists in any package registry and no OEB GitHub organisation exists.
  confirmed:
  - The two surfaces are genuinely anonymous - 38 operations executed with no key, token or cookie.
  - The Green Button implementation register remains a PDF, outside the open data programme.
  - No vulnerability disclosure policy, no bug bounty, no trust centre, no certifications.
  artifacts_written:
  - openapi/ontario-energy-board-open-data-openapi.yml (generated from live probes, 33 verified operations)
  - openapi/ontario-energy-board-rds-openapi.yml (generated from live probes, 5 operations)
  - vocabulary/ontario-energy-board-rds-search-clauses.yml (searched - 303 clauses)
  - json-schema/ontario-energy-board-rds-record-search-response.json (derived)
  - examples/ (3 real captured responses, including both error shapes)
  - overlays/ (2), data-model/, errors/, conventions/, conformance/, lifecycle/, changelog/
  - authentication/, packages/, well-known/, mcp/ (candidate only), llms/, skills/ (3)
  provenance_caution: >-
    Both OpenAPI documents in this repo were GENERATED by API Evangelist from live probes and are
    marked x-published-by-provider false, with per-operation x-evidence naming the URL, status,
    content type and byte size observed. The OEB publishes no specification. No MCPServer, SDKs,
    Idempotency, StatusPage, Deprecation, Roadmap, Security, Compliance, TrustCenter, Webhooks,
    AsyncAPI, Sandbox, CLI, WellKnown or Packages pointer was wired, because none of those things
    exists here.
