artifacts_harvested:
  openapi: 0
  asyncapi: 0
  postman: 0
  graphql: 0
  json_schema: 0
  note: >-
    No machine-readable API contract of any kind is published by the OEB. No OpenAPI,
    no XSD for the open data XML, no JSON Schema, no DCAT catalogue, no data dictionary
    endpoint. The nearest thing to a schema artifact is an XLSX "data keys" workbook
    per rates dataset. Nothing was saved to openapi/ because nothing real exists to
    save; fabricating one would be worse than the gap.

findings:
  headline: >-
    The regulator out-publishes the regulated. The OEB gives away ~60 machine-readable
    files with no key and no signup, while every Ontario utility bound by the mandate
    it enforces keeps its consumer data behind application approval or a login.
  second_finding: >-
    A mandate is not an implementation — but Ontario is the case where the two can be
    told apart, because the regulator publishes the register. 54 distributors confirmed,
    6 extensions, 3 classes exempt. That register is the single most useful artifact
    in this entire jurisdiction, and it is a PDF that is not in the open data programme.
  third_finding: >-
    Open data without a contract is still a manual integration. Every OEB dataset is
    a hand-fetched file with an undocumented, bespoke XML shape and no versioning
    scheme beyond the filename. The one surface that behaves like an API — RDS with
    format=json — works only because the vendor product does it by default, not
    because the OEB offers it.

