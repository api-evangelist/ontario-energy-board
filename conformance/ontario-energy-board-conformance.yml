compliance_program_note: >-
  The OEB publishes no trust centre, no SOC 2 / ISO 27001 / PCI attestation, no penetration-test
  summary and no vulnerability disclosure policy. probe-security-programs found no bug bounty and no
  trust centre; /.well-known/security.txt is a 404. As a provincial regulator it is subject to
  Ontario's public-sector accountability regime rather than to commercial certification, and it makes
  no certification claim of its own. No `Compliance` and no `TrustCenter` pointer is emitted.
