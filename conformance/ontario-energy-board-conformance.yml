  - https://www.oeb.ca/consultations-and-projects/policy-initiatives-and-consultations/green-button-implementation
- id: ontario-energy-board-act-1998
  name: Ontario Energy Board Act, 1998
  applies: true
  applies_evidence: The OEB's own constituting statute; the source of its licensing, rate-setting and RRR reporting powers, which are what the open datasets contain.
- id: ontario-digital-and-data-directive-2021
  name: Ontario's Digital and Data Directive (2021)
  url: https://www.ontario.ca/page/ontarios-digital-and-data-directive-2021
  applies: true
